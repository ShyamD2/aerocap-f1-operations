version: '3.8'

services:
  f1-mission-control:
    build: .
    container_name: f1_opscorrelate_app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_THEME_BASE=dark
    restart: unless-stopped
